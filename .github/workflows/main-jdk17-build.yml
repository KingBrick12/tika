name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write

env:
  MODULE: tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-ocr-module
  SEMGREP_RULES: --config p/java --config r/java.lang.security

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Installer Semgrep
        run: pipx install semgrep
      - name: Rapport Semgrep complet du module (pour comparer avant/apres)
        run: |
          semgrep scan $SEMGREP_RULES --metrics=off --json-output="$RUNNER_TEMP/semgrep-report.json" --text-output="$RUNNER_TEMP/semgrep-report.txt" "$MODULE" || true
          echo "Nombre total d'alertes dans le module : $(jq '.results | length' "$RUNNER_TEMP/semgrep-report.json")"
          cat "$RUNNER_TEMP/semgrep-report.txt"
      - name: Semgrep - bloquer les nouvelles vulnerabilites
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "Comparaison avec le commit $BASE"
          semgrep scan $SEMGREP_RULES --baseline-commit "$BASE" --error --metrics=off "$MODULE"
      - name: Publier le rapport Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: ${{ runner.temp }}/semgrep-report.*

  build:
    needs: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Construire les dependances du module OCR
        run: ./mvnw -B -q install -pl :tika-parser-ocr-module -am -DskipTests
      - name: Tests du module OCR
        run: ./mvnw -B test -pl :tika-parser-ocr-module
      - name: Rickroll si un test echoue
        if: failure()
        uses: ./.github/actions/rickroll
