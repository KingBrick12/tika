name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

env:
  MODULE: tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-ocr-module

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Installer Semgrep
        run: pipx install semgrep
      - name: Semgrep - bloquer les nouvelles vulnerabilites
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "Comparaison avec le commit $BASE"
          semgrep scan --config p/java --baseline-commit "$BASE" --error --metrics=off "$MODULE"

  build:
    needs: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Construire les dependances du module OCR
        run: ./mvnw -B -q install -pl :tika-parser-ocr-module -am -DskipTests
      - name: Tests du module OCR
        run: ./mvnw -B test -pl :tika-parser-ocr-module
