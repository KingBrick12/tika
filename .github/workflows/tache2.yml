# A placer dans .github/workflows/tache2.yml
name: tache2-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Construire les modules dont depend le module OCR
        run: ./mvnw -B -q install -pl :tika-parser-ocr-module -am -DskipTests

      - name: Executer les tests du module OCR (originaux + generes + manuels)
        run: ./mvnw -B test -pl :tika-parser-ocr-module
